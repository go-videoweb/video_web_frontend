apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: videoweb-frontend
  namespace: videoweb
spec:
  ingressClassName: traefik
  rules:
    - host: video.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: videoweb-frontend
                port:
                  number: 80
